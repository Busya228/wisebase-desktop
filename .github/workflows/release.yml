name: Release desktop app

# Полностью автоматический выпуск обновлений.
#
# Запускается при ЛЮБОМ обычном `git push` в main, если изменилось само
# приложение (app/, main.js, package.json, build/). Ни версию, ни теги вручную
# поднимать не нужно:
#   • номер версии: ровно тот, что в package.json ("version"), если такой ещё
#     больше всех существующих релизов; иначе следующий patch старшего релиза;
#   • сначала прогоняются автотесты (test/run-all.js) — если хоть один упал,
#     сборки нет и пользователи ничего не получат;
#   • Windows и macOS собираются параллельно и заливаются в черновик релиза;
#   • когда ВСЕ файлы залиты, черновик публикуется автоматически — только
#     после этого установленные приложения видят обновление (никто не получит
#     «полурелиз» без файлов).
# Хотите сменить «большую» версию (например на 30.0) — поменяйте "version" в
# package.json на 30.0.0, дальше счёт пойдёт как 30.0.N.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'main.js'
      - 'preload.js'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'scripts/**'
      - 'test/**'
      - 'publish-update.bat'
      - '.github/workflows/release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ошибка запроса GitHub прерывает выпуск, а не маскируется как отсутствие версии.
          gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName > "$RUNNER_TEMP/releases.json"
          V=$(node scripts/next-release-version.js "$RUNNER_TEMP/releases.json")
          echo "Версия релиза: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  # Автотесты — тот же набор, что и `node test/run-all.js` локально.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установить Playwright
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Прогнать тесты
        run: node test/run-all.js
      - name: Логи тестов (при ошибке)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test/last-run-*.log

  build:
    needs: [version, test]
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: release:win
          - os: macos-latest
            script: release:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Описание релиза («Что нового») берётся из RELEASE_NOTES.md — его же
      # пользователи видят в окне «Доступна новая версия приложения».
      - run: gh release edit "v${{ needs.version.outputs.version }}" --repo "${{ github.repository }}" --notes-file RELEASE_NOTES.md --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
