name: Release desktop app

# Полностью автоматический выпуск обновлений.
#
# Запускается при ЛЮБОМ обычном `git push` в main, если изменилось само
# приложение (app/, main.js, package.json, build/). Ни версию, ни теги вручную
# поднимать не нужно:
#   • номер версии: ровно тот, что в package.json ("version"), если такой ещё
#     не выпускали; иначе автоматически <major>.<minor>.<номер запуска>;
#   • Windows и macOS собираются параллельно и заливаются в черновик релиза;
#   • когда ВСЕ файлы залиты, черновик публикуется автоматически — только
#     после этого установленные приложения видят обновление (никто не получит
#     «полурелиз» без файлов).
# Хотите сменить «большую» версию (например на 30.0) — поменяйте "version" в
# package.json на 30.0.0, дальше счёт пойдёт как 30.0.N.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'main.js'
      - 'package.json'
      - 'build/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Номер версии:
          #  • если версии из package.json (например 29.1.0) ещё нет в релизах —
          #    выпускаем ровно её;
          #  • если она уже выпущена — автоматически <major>.<minor>.<номер запуска>.
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            V="$(echo "$V" | cut -d. -f1-2).${{ github.run_number }}"
          fi
          echo "Версия релиза: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: release:win
          - os: macos-latest
            script: release:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Описание релиза («Что нового») берётся из RELEASE_NOTES.md — его же
      # пользователи видят в окне «Доступна новая версия приложения».
      - run: gh release edit "v${{ needs.version.outputs.version }}" --repo "${{ github.repository }}" --notes-file RELEASE_NOTES.md --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
