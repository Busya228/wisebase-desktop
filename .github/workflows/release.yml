name: Release desktop app

# Builders do not publish to GitHub. Only the final job may publish after
# local checksums and the actual uploaded asset list have both been verified.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'main.js'
      - 'preload.js'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'scripts/**'
      - 'test/**'
      - 'publish-update.bat'
      - '.github/workflows/release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName > "$RUNNER_TEMP/releases.json"
          V=$(node scripts/next-release-version.js "$RUNNER_TEMP/releases.json")
          echo "Version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tests
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run tests
        run: node test/run-all.js
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test/last-run-*.log

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            platform: win
          - os: macos-latest
            script: dist:mac
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - name: Build locally (no release uploads)
        run: npm run ${{ matrix.script }} -- --publish never
      - name: Verify platform files and updater checksums
        run: node scripts/verify-release-files.js dist ${{ needs.version.outputs.version }} ${{ matrix.platform }}
      - name: Transfer verified build files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/*.yml

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-files
      - name: Verify complete Windows and macOS release
        run: node scripts/verify-release-files.js release-files "$VERSION" all release-inventory.json
      - name: Create draft and upload verified files (single publisher)
        shell: bash
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "WiseBase CRM $VERSION" --notes-file RELEASE_NOTES.md
          mapfile -t files < <(node -e 'for(const f of require("./release-inventory.json").files)console.log("release-files/"+f.name)')
          gh release upload "v$VERSION" "${files[@]}" release-inventory.json --repo "$GITHUB_REPOSITORY"
      - name: Verify files uploaded to GitHub before publishing
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > remote-release.json
          node scripts/verify-release-files.js --remote remote-release.json release-inventory.json
      - name: Publish complete release
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Save release verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          if-no-files-found: ignore
          path: |
            release-inventory.json
            remote-release.json
